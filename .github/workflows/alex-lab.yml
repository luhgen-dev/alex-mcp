name: External Alex Lab

on:
  pull_request:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to exercise"
        required: false
        default: "all"
        type: choice
        options: [all, phase1, phase2, phase3]
      gate:
        description: "Fail the workflow if Alex behaviour is not clean"
        required: false
        default: false
        type: boolean

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r alex-mcp/app/requirements.txt

      - name: Prepare independent reasoning delta
        id: prepare_review
        run: |
          python alex-mcp/app/github_models_delta_review.py prepare \
            --snapshot alex-mcp/app/real_ai_snapshot.json \
            --prompt-out /tmp/alex-independent-review-prompt.txt \
            --metadata-out /tmp/alex-independent-review-meta.json
          python - <<'PY'
          import json, os
          meta = json.load(open("/tmp/alex-independent-review-meta.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("needs_review=" + ("true" if meta.get("delta_packets") else "false") + "\n")
          PY

      - name: Install Copilot CLI for independent review
        if: steps.prepare_review.outputs.needs_review == 'true'
        run: npm install -g @github/copilot

      - name: Isolate public reviewer workspace
        if: steps.prepare_review.outputs.needs_review == 'true'
        run: |
          tar -C "$GITHUB_WORKSPACE" -czf /tmp/alex-repo-before-review.tgz .
          cp /tmp/alex-independent-review-prompt.txt /tmp/alex-review-public.txt
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp /tmp/alex-review-public.txt "$GITHUB_WORKSPACE/review.txt"

      - name: Run isolated independent reasoning review
        if: steps.prepare_review.outputs.needs_review == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          copilot -p "Read review.txt from the current workspace and follow its instructions exactly. Return only the requested JSON, with no markdown." \
            -s --no-ask-user --model auto --allow-tool='read(review.txt)' \
            --log-level=debug \
            > /tmp/alex-independent-review-response.txt \
            2> /tmp/alex-independent-review-stderr.txt
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "Copilot reviewer failed with exit code $STATUS"
            cat /tmp/alex-independent-review-stderr.txt
            exit "$STATUS"
          fi
          test -s /tmp/alex-independent-review-response.txt

      - name: Restore repository after isolated review
        if: always() && steps.prepare_review.outputs.needs_review == 'true'
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -C "$GITHUB_WORKSPACE" -xzf /tmp/alex-repo-before-review.tgz

      - name: Import and verify independent reasoning delta
        if: steps.prepare_review.outputs.needs_review == 'true'
        run: |
          python alex-mcp/app/github_models_delta_review.py import \
            --snapshot alex-mcp/app/real_ai_snapshot.json \
            --response /tmp/alex-independent-review-response.txt \
            --report /tmp/alex-copilot-independent-review.json

      - name: Run external Alex Lab
        shell: bash
        run: |
          PHASE="${{ github.event.inputs.phase || 'all' }}"
          GATE=""
          if [ "${{ github.event.inputs.gate || 'false' }}" = "true" ]; then
            GATE="--gate"
          fi
          python alex-mcp/app/alex_lab.py \
            --phase "$PHASE" \
            --report /tmp/alex-lab-report.json \
            --packets /tmp/alex-lab-failures.jsonl \
            --human-ai-packets /tmp/alex-human-ai-packets.jsonl \
            --human-ai-report /tmp/alex-human-ai-report.json \
            $GATE

      - name: Upload Alex Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alex-lab-evidence
          path: |
            /tmp/alex-lab-report.json
            /tmp/alex-lab-failures.jsonl
            /tmp/alex-human-ai-packets.jsonl
            /tmp/alex-human-ai-report.json
            /tmp/alex-real-ai-reasoning-review.json
            /tmp/alex-chatgpt-reasoning-review.json
            /tmp/alex-copilot-independent-review.json
            /tmp/alex-independent-review-meta.json
            alex-mcp/app/real_ai_snapshot.json
          if-no-files-found: error
          retention-days: 14

      - name: Print concise Alex Lab result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("/tmp/alex-lab-report.json")
          if not path.exists():
              raise SystemExit("Alex Lab report was not produced")
          report = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps({
              "status": report.get("status"),
              "summary": report.get("summary"),
              "checks": [
                  {
                      "label": row.get("label"),
                      "status": row.get("status"),
                      "returncode": row.get("returncode"),
                  }
                  for row in report.get("checks", [])
              ],
          }, indent=2))
          PY
