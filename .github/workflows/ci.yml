name: Alex MCP CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r alex-mcp/app/requirements.txt
          pip install pyflakes

      - name: Reject undefined Python names
        run: |
          set +e
          OUTPUT="$(pyflakes alex-mcp/app 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            printf '%s\n' "$OUTPUT"
          fi
          if printf '%s\n' "$OUTPUT" | grep -q "undefined name"; then
            echo "Undefined Python name detected."
            exit 1
          fi

      - name: Compile Python
        run: python -m compileall -q alex-mcp/app tests

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Run structural self-test
        env:
          ALEX_DATA_DIR: /tmp/alex-mcp-selftest
          ALEX_OPTIONS_PATH: /tmp/alex-mcp-empty-options.json
        run: python alex-mcp/app/selftest.py

      - name: Run Phase 3 stress harness
        run: python alex-mcp/app/stress_test.py

      - name: Audit Phase 3 Tier-B behaviour certification catalog
        run: python alex-mcp/app/behavior_cert.py --mode catalog

      - name: Exercise Tier-B offline certification runner
        run: |
          python alex-mcp/app/behavior_cert.py --mode offline --phase all --no-fail-exit \
            --report /tmp/alex-behavior-offline.json >/tmp/alex-behavior-offline.log
          python - <<'PY'
          import json
          report = json.load(open("/tmp/alex-behavior-offline.json", encoding="utf-8"))
          baseline = json.load(open("alex-mcp/app/behavior_known_failures.json", encoding="utf-8"))
          current = set(report.get("failure_signatures", []))
          known = set(baseline.get("failure_signatures", []))
          new_failures = sorted(current - known)
          resolved = sorted(known - current)
          print(json.dumps({
              "status": report["status"],
              "contracts": report["summary"]["contracts"],
              "variant_checks_passed": report["summary"]["variant_checks_passed"],
              "discovery_dependent": report["summary"].get("discovery_dependent_checks", 0),
              "failures_found": report["summary"]["failures"],
              "known_failures_remaining": len(current & known),
              "resolved_known_failures": len(resolved),
              "new_failure_signatures": new_failures,
          }, indent=2))
          if new_failures:
              raise SystemExit(
                  "Behaviour regression ratchet failed: new offline failure signatures detected"
              )
          PY

      - name: Build full human-AI reasoning corpus
        run: |
          python alex-mcp/app/human_ai_lab.py --mode selftest --phase all \
            --packets /tmp/alex-human-ai-packets.jsonl \
            --report /tmp/alex-human-ai-report.json

      - name: Prepare independent reasoning delta
        id: prepare_review
        run: |
          rm -rf /tmp/alex-independent-review-prompts /tmp/alex-independent-review-responses
          mkdir -p /tmp/alex-independent-review-prompts /tmp/alex-independent-review-responses
          python alex-mcp/app/sharded_reasoning_review.py prepare \
            --snapshot alex-mcp/app/real_ai_snapshot.json \
            --prompt-dir /tmp/alex-independent-review-prompts \
            --metadata-out /tmp/alex-independent-review-meta.json \
            --shard-size 48
          python - <<'PY'
          import json, os
          meta = json.load(open("/tmp/alex-independent-review-meta.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("needs_review=" + ("true" if meta.get("delta_packets") else "false") + "\n")
              out.write("shard_count=" + str(meta.get("shard_count", 0)) + "\n")
              out.write("delta_packets=" + str(meta.get("delta_packets", 0)) + "\n")
          PY

      - name: Install Copilot CLI for independent review
        if: steps.prepare_review.outputs.needs_review == 'true'
        run: npm install -g @github/copilot

      - name: Isolate public reviewer workspace
        if: steps.prepare_review.outputs.needs_review == 'true'
        run: |
          tar -C "$GITHUB_WORKSPACE" -czf /tmp/alex-repo-before-review.tgz .
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Run isolated sharded independent reasoning review
        id: independent_review
        if: steps.prepare_review.outputs.needs_review == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          REVIEW_STATUS="complete"
          REVIEW_REASON=""
          for PROMPT_FILE in /tmp/alex-independent-review-prompts/shard-*.txt; do
            NAME="$(basename "$PROMPT_FILE" .txt)"
            cp "$PROMPT_FILE" "$GITHUB_WORKSPACE/review.txt"
            echo "Reviewing $NAME"
            set +e
            copilot -p "Read review.txt from the current workspace and follow its instructions exactly. Return only the requested JSON, with no markdown." \
              -s --no-ask-user --model auto --allow-tool='read(review.txt)' \
              > "/tmp/alex-independent-review-responses/$NAME.json" \
              2> "/tmp/$NAME.stderr"
            STATUS=$?
            set -e
            if [ "$STATUS" -ne 0 ]; then
              if grep -qi "exceeded your monthly quota" "/tmp/$NAME.stderr"; then
                REVIEW_STATUS="deferred"
                REVIEW_REASON="github_copilot_monthly_quota"
                echo "::warning::Independent model review deferred: GitHub Copilot monthly quota exhausted at $NAME."
                python - <<PY
                import json
                from pathlib import Path
                Path("/tmp/alex-independent-review-deferred.json").write_text(
                    json.dumps({
                        "status": "DEFERRED_EXTERNAL_REVIEW",
                        "reason": "github_copilot_monthly_quota",
                        "failed_shard": "$NAME",
                        "completed_response_files": sorted(
                            p.name for p in Path("/tmp/alex-independent-review-responses").glob("shard-*.json")
                            if p.stat().st_size > 0
                        ),
                        "not_claimed_as_pass": True,
                    }, indent=2) + "\n",
                    encoding="utf-8",
                )
                PY
                rm -f "$GITHUB_WORKSPACE/review.txt"
                break
              fi
              echo "Copilot reviewer failed for $NAME with exit code $STATUS"
              cat "/tmp/$NAME.stderr"
              exit "$STATUS"
            fi
            test -s "/tmp/alex-independent-review-responses/$NAME.json"
            rm -f "$GITHUB_WORKSPACE/review.txt"
          done
          echo "status=$REVIEW_STATUS" >> "$GITHUB_OUTPUT"
          echo "reason=$REVIEW_REASON" >> "$GITHUB_OUTPUT"

      - name: Restore repository after isolated review
        if: always() && steps.prepare_review.outputs.needs_review == 'true'
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -C "$GITHUB_WORKSPACE" -xzf /tmp/alex-repo-before-review.tgz

      - name: Import and verify sharded independent reasoning delta
        if: steps.prepare_review.outputs.needs_review == 'true' && steps.independent_review.outputs.status == 'complete'
        run: |
          python alex-mcp/app/sharded_reasoning_review.py import \
            --snapshot alex-mcp/app/real_ai_snapshot.json \
            --response-dir /tmp/alex-independent-review-responses \
            --report /tmp/alex-copilot-independent-review.json

      - name: Preserve independent-review evidence
        if: always() && steps.prepare_review.outputs.needs_review == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alex-independent-review-snapshot
          path: |
            alex-mcp/app/real_ai_snapshot.json
            /tmp/alex-copilot-independent-review.json
            /tmp/alex-independent-review-deferred.json
            /tmp/alex-independent-review-meta.json
            /tmp/alex-independent-review-responses/
          retention-days: 14

      - name: Run frozen real-AI reasoning snapshot
        if: steps.prepare_review.outputs.needs_review != 'true' || steps.independent_review.outputs.status == 'complete'
        run: |
          python alex-mcp/app/real_ai_snapshot_review.py \
            --report /tmp/alex-real-ai-review.json

      - name: Run deterministic reasoning regression oracle
        run: python alex-mcp/app/chatgpt_reasoning_review.py

      - name: Run final parity architecture audit
        env:
          ALEX_EXTERNAL_REVIEW_DEFERRED: ${{ steps.independent_review.outputs.status == 'deferred' && '1' || '0' }}
          ALEX_EXTERNAL_REVIEW_REASON: ${{ steps.independent_review.outputs.reason }}
        run: python alex-mcp/app/final_audit.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        working-directory: alex-mcp/app
        run: npm install --omit=dev

      - name: Check WhatsApp bridge syntax
        run: node --check alex-mcp/app/connect.js

      - name: Verify WhatsApp control payload contract
        run: node alex-mcp/app/control_payload.test.js

      - name: Verify WhatsApp reaction identity contract
        run: node alex-mcp/app/reaction_payload.test.js

      - name: Verify WhatsApp quoted-context payload contract
        run: node alex-mcp/app/quoted_payload.test.js

      - name: Verify per-conversation FIFO contract
        run: node alex-mcp/app/conversation_queue.test.js

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Home Assistant app image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/base:3.24 --build-arg BUILD_COMMIT="$GITHUB_SHA" -t alex-mcp-ci alex-mcp

      - name: Verify local media binaries
        run: |
          docker run --rm --entrypoint /bin/sh alex-mcp-ci -c 'command -v ffmpeg && command -v tesseract && command -v pdftotext && command -v whisper-cli'


      - name: Smoke-test dot startup in packaged HA image (no network)
        run: |
          docker run --rm --network none --entrypoint /bin/sh \
            -v "$PWD/tests:/tests:ro" -e PYTHONPATH=/app -e ALEX_TEST_PACKAGED_RUNTIME=1 \
            alex-mcp-ci -c 'python3 -m unittest discover -s /tests -p test_dot_startup.py -v'
