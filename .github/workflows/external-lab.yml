name: Alex External Lab

on:
  pull_request:
  workflow_dispatch:

jobs:
  external-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r alex-mcp/app/requirements.txt

      - name: Run external Alex lab
        run: python alex-mcp/app/external_lab.py certify --phase all --report-dir /tmp/alex-external-lab

      - name: Show compact lab manifest
        if: always()
        run: cat /tmp/alex-external-lab/manifest.json || true

      - name: Upload external lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alex-external-lab
          path: /tmp/alex-external-lab
          if-no-files-found: warn
