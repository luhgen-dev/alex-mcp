name: "Alex MCP"
version: "0.5.23"
slug: "alex_mcp"
description: "MCP-first household assistant — natural WhatsApp conversation, deterministic tools, receipts, reminders and memory"
arch:
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
homeassistant_api: true
panel_icon: "mdi:robot-happy-outline"
panel_title: "Alex MCP"
map:
  - data:rw
options:
  ai_provider: "auto"
  grok_model: "grok-4.7"
  gemini_model: "gemini-3.8-flash"
  gemini_lite_model: "gemini-3.1-flash-lite"
  openai_model: "gpt-5.6-luna"
  xai_api_key: ""
  gemini_api_key: ""
  openai_api_key: ""
  husband_phone: ""
  wife_phone: ""
  husband_name: "Luhgen"
  wife_name: "Priya"
  timezone: "Asia/Kuala_Lumpur"
  stt_provider: "auto"
  cloud_stt_rescue_enabled: false
  whisper_model: "base"
  ocr_enabled: true
  context_turns: 8
  reasoning_effort: "low"
  monthly_ai_budget_usd: 0.0
  auto_grok_fallback_budget_usd: 0.5
  budget_safety_multiplier: 2.0
  income_profiles: []
  roster_profiles: []
  overtime_profiles: []
  leave_balances: []
  recurring_payments: []
  account_aliases: []
  reminder_preferences: []
  presence_mappings: []
  ha_notify_devices: []
schema:
  ai_provider: "list(auto|grok|gemini|openai)"
  grok_model: str
  gemini_model: str
  gemini_lite_model: str
  openai_model: str
  xai_api_key: password
  gemini_api_key: password
  openai_api_key: password
  husband_phone: str
  wife_phone: str
  husband_name: str
  wife_name: str
  timezone: str
  stt_provider: "list(auto|local_whisper|xai|openai|gemini)"
  cloud_stt_rescue_enabled: bool
  whisper_model: "list(tiny|base|small)"
  ocr_enabled: bool
  context_turns: "int(2,20)"
  reasoning_effort: "list(low|medium|high)"
  monthly_ai_budget_usd: "float(0,)"
  auto_grok_fallback_budget_usd: "float(0,)"
  budget_safety_multiplier: "float(1,10)"
  income_profiles:
    - id: str
      owner: "list(husband|wife)"
      visibility: "list(private|family)"
      name: str
      amount: float
      currency: "list(MYR|SGD)"
      income_class: "list(fixed|variable)"
      frequency: "list(weekly|fortnightly|monthly|annual)"
      payday_day: "int(1,31)"
      effective_from: "str?"
      active: bool
  roster_profiles:
    - id: str
      owner: "list(husband|wife)"
      visibility: "list(private|family)"
      name: str
      cycle_start: "str?"
      pattern: str
      day_start: "str?"
      day_end: "str?"
      evening_start: "str?"
      evening_end: "str?"
      active: bool
  overtime_profiles:
    - id: str
      owner: "list(husband|wife)"
      visibility: "list(private|family)"
      name: str
      currency: "list(MYR|SGD)"
      morning_pre_hours: "float?"
      morning_pre_start: "str?"
      morning_weekend_standard_start: "str?"
      morning_weekend_standard_end: "str?"
      morning_weekend_low_start: "str?"
      morning_weekend_low_end: "str?"
      evening_post_hours: "float?"
      evening_post_start: "str?"
      evening_post_end: "str?"
      evening_weekend_days: "str?"
      evening_weekend_standard_start: "str?"
      evening_weekend_standard_end: "str?"
      evening_weekend_low_start: "str?"
      evening_weekend_low_end: "str?"
      sunday_override_allowed: bool
      payout_days: "str?"
      rate_formula: "str?"
      active: bool
  leave_balances:
    - id: str
      owner: "list(husband|wife)"
      visibility: "list(private|family)"
      name: str
      entitlement_days: float
      remaining_days: float
      as_of_date: str
      active: bool
  recurring_payments:
    - id: str
      owner: "list(husband|wife|family)"
      visibility: "list(private|family)"
      name: str
      amount_type: "list(fixed|variable)"
      amount: "float?"
      currency: "list(MYR|SGD)"
      due_day: "int(1,31)"
      frequency: "list(weekly|monthly|quarterly|annual)"
      category: "str?"
      auto_pay: bool
      effective_from: "str?"
      active: bool
  account_aliases:
    - id: str
      owner: "list(husband|wife|family)"
      visibility: "list(private|family)"
      label: str
      purpose: "str?"
      active: bool
  reminder_preferences:
    - id: str
      owner: "list(husband|wife)"
      visibility: "list(private|family)"
      name: str
      bill_days_before: int
      follow_up_after_hours: int
      quiet_start: "str?"
      quiet_end: "str?"
      presence_aware: bool
      active: bool
  presence_mappings:
    - id: str
      owner: "list(husband|wife)"
      visibility: "list(private|family)"
      name: str
      person_entity: "str?"
      phone_tracker_entity: "str?"
      home_zone: str
      active: bool
  ha_notify_devices:
    - id: str
      owner: "list(husband|wife)"
      notify_service: str
      active: bool
