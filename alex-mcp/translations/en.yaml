configuration:
  grocery_background_prices:
    name: Quiet background grocery pricing
    description: Queue retailer lookups after list changes. Plain lists hide prices; ask for prices/totals to see saved estimates. Ambiguous products require a choice.
  digi_screenshot_reminder_enabled:
    name: Monthly Digi screenshot prompt
    description: Ask the configured husband privately for both Digi bill screenshots once monthly from the 16th. No SMS, phone control, PDFs or messages to the spouse.
  digi_screenshot_reminder_time:
    name: Digi prompt time
    description: Local HH:MM on the 16th, default 19:00. Catches up once if Alex was offline.
  digi_husband_line:
    name: Husband Digi line
    description: Exact Digi mobile number, with country code. This can differ from the WhatsApp number.
  digi_wife_line:
    name: Wife Digi line
    description: Exact second Digi line. No other supplementary numbers are tracked.
  tnb_portal_enabled:
    name: Enable TNB portal adapter
    description: Off until configured and tested. Reads the home bill on demand only; no payments or automatic bill sending.
  tnb_email:
    name: TNB portal email
    description: Enter privately here. A cloud-browser login does not configure Alex.
  tnb_password:
    name: TNB portal password
    description: Stored in Home Assistant options. Never send passwords in WhatsApp. Interactive verification may require signing in directly.
  tnb_account:
    name: TNB home account
    description: Exact account identifier as shown on the portal, including letters and hyphens. Used to reject mismatched accounts.
  saj_portal_enabled:
    name: Enable SAJ portal adapter
    description: Off until configured and tested. Reads the home bill on demand only; no payments or automatic bill sending.
  saj_email:
    name: SAJ portal email
    description: Enter privately here. A cloud-browser login does not configure Alex.
  saj_password:
    name: SAJ portal password
    description: Stored in Home Assistant options. Never send passwords in WhatsApp. Interactive verification may require signing in directly.
  saj_account:
    name: SAJ home account
    description: Exact account identifier as shown on the portal, including letters and hyphens. Used to reject mismatched accounts.
  manjaku_prices_enabled:
    name: Manjaku live prices
    description: Read current Manjaku Online listed prices in the background and on request. Physical stores and cart discounts may differ. Disable to stop all Manjaku lookups.
  mydin_prices_enabled:
    name: MYDIN live prices
    description: Read current MYDIN Online prices in the background and on request. No login or API key required. Disable to stop all MYDIN lookups.
  ai_provider:
    name: AI brain
    description: "Choose the brain. dot is EXPERIMENTAL: shared-shopping text only and requires a verified connection; it never falls back to another provider. Existing modes stay unchanged."
  dot_enabled:
    name: Enable dot experiment
    description: "Off by default. With AI brain set to dot, enabling permits an outbound private tunnel and creates a local bridge credential. Enable only after approving the personal connection; this alone does not prove dot is connected."
  dot_transport:
    name: Dot connection transport
    description: "disabled, approved private tunnel, or OAuth-protected HTTPS. No public port is opened by this setting."
  dot_owner_subject:
    name: Dot OAuth owner binding (OAuth only)
    description: "Exact verified OAuth subject for OAuth mode only. Private tunnel derives its stable binding automatically from the approved tunnel ID."
  dot_tunnel_id:
    name: Dot private tunnel ID
    description: "Owner-only personal tunnel identifier, not a key. Use the masked runtime-key field below; the add-on manages private credential files."
  dot_tunnel_runtime_key:
    name: Dot restricted tunnel runtime key
    description: "Paste only the approved restricted runtime key here, never in chat. Masked like existing provider keys; stored by Home Assistant. No admin key. Used only after explicit dot/private-tunnel enablement."
  dot_oauth_issuer:
    name: Dot OAuth issuer (OAuth transport only)
    description: "Existing authorization server HTTPS issuer; must support authorization code with PKCE."
  dot_oauth_jwks_url:
    name: Dot OAuth JWKS URL
    description: "Administrator-approved HTTPS signing-key endpoint for that issuer."
  dot_resource_url:
    name: Dot OAuth resource URL
    description: "Approved public HTTPS resource ending in /mcp/. Leave empty for private tunnel."
  grok_model:
    name: Grok model
    description: xAI model used when AI brain is Grok.
  gemini_model:
    name: Gemini model
    description: Google model used when AI brain is Gemini.
  openai_model:
    name: OpenAI model
    description: OpenAI model used when AI brain is OpenAI.
  xai_api_key:
    name: xAI API key
    description: Stored only in Home Assistant app options. Required for Grok and xAI speech-to-text.
  gemini_api_key:
    name: Gemini API key
    description: Stored only in Home Assistant app options. Required only when Gemini is selected or used for speech-to-text.
  openai_api_key:
    name: OpenAI API key
    description: Stored only in Home Assistant app options. Required only when OpenAI is selected or used for speech-to-text.
  husband_phone:
    name: Husband WhatsApp number
    description: International format with country code, for example +60123456789.
  wife_phone:
    name: Wife WhatsApp number
    description: International format with country code, for example +60123456789.
  timezone:
    name: Household timezone
    description: IANA timezone used for reminders and date interpretation.
  stt_provider:
    name: Legacy transcription provider
    description: Legacy diagnostic setting. The opt-in WhatsApp voice path below uses one OpenAI transcription and does not run local/cloud comparison passes.
  voice_notes_enabled:
    name: Understand WhatsApp voice notes
    description: Send addressed voice notes to OpenAI once and handle the transcript like a text request. Off preserves the existing pending-review inbox. Test with your household recordings before relying on it.
  voice_openai_api_key:
    name: Voice OpenAI API key
    description: Use a key from your credited API organization. Stored in Home Assistant options; never send it in chat. If empty, uses the existing OpenAI API key. This dedicated key does not change the everyday AI brain.
  voice_monthly_budget_usd:
    name: Voice transcription monthly limit (USD)
    description: Default 5 USD, based on estimated audio duration in each calendar month. Zero stops new transcriptions. This is separate from the text brain and is not your live OpenAI credit balance. Failed/interrupted uploads retain their reserved estimate.
  voice_max_seconds:
    name: Maximum voice-note length
    description: Maximum seconds per note, default 180. Longer recordings remain pending rather than being silently cut short.
  voice_language_hints:
    name: Expected spoken languages
    description: Language hints, default ta (Tamil), en (English), ms (Malay). Mixed speech stays in its original languages.
  voice_keywords:
    name: Voice vocabulary hints
    description: Optional names or product terms you actually use, one item per entry. Keep this short; hints are not guaranteed words in the recording.
  whisper_model:
    name: Local Whisper model
    description: Base is the default balance. Small uses more memory but can improve difficult multilingual voice notes.
  ocr_enabled:
    name: Local receipt OCR
    description: Extract receipt text locally before the AI sees it.
  context_turns:
    name: Conversation memory window
    description: Number of recent turns supplied to the AI for natural follow-ups.
  reasoning_effort:
    name: Reasoning effort
    description: How deeply the selected AI should reason. Medium is the default balance for Alex.
  monthly_ai_budget_usd:
    name: Monthly AI budget guard (USD)
    description: Optional. Leave 0 to disable. When enabled, Alex stops new model calls after the conservative monthly guard is reached.
  budget_safety_multiplier:
    name: Budget safety multiplier
    description: Conservative multiplier applied to estimated model spend before enforcing the optional monthly limit. Default is 2x.
  chatgpt_plan_mode:
    name: ChatGPT plan mode
    description: Use your own ChatGPT subscription (sign in from the Alex MCP panel). off = not used. shadow_only = only the log-only AI router comparison uses it; replies are unchanged. primary = ChatGPT answers text messages first and your API providers stay as automatic fallbacks.
  chatgpt_plan_model:
    name: ChatGPT plan model
    description: Optional. Leave empty to use the first model your plan offers (listed in the panel after sign-in).
  ai_routing:
    name: Semantic AI routing
    description: off = keep Alex's deterministic keyword routing. shadow = GPT-6/Luna interprets messages in the background for comparison only and never changes a reply. live = the same semantic router may guide tool exposure and interpretation, while Alex's deterministic privacy, mutation and tool guards remain authoritative. on is a legacy alias for live. Needs ChatGPT plan mode shadow_only or primary and a signed-in plan.
  income_profiles:
    name: Income profiles
    description: Stable fixed/variable income facts. Edit here instead of source code; history is versioned into SQLite.
  roster_profiles:
    name: Roster profiles
    description: Stable repeating work roster patterns and shift times.
  overtime_profiles:
    name: Overtime profiles
    description: Stable OT eligibility windows and payout-day rules. Leave the pay formula blank until it is genuinely known.
  leave_balances:
    name: Leave balance snapshots
    description: Authoritative annual/medical leave snapshots with as-of dates.
  recurring_payments:
    name: Recurring bills and commitments
    description: Expected recurring obligations. Actual paid/unpaid/deferred state is stored separately at runtime.
  account_aliases:
    name: Account aliases
    description: Non-sensitive nicknames used to recognize forwarded payment/slip destinations. Never store bank credentials here.
  reminder_preferences:
    name: Reminder preferences
    description: Optional quiet hours, follow-up delay and presence-aware routine delivery.
  presence_mappings:
    name: Presence mappings
    description: Optional Home Assistant person/device-tracker entities used only for routine reminder delivery policy.

